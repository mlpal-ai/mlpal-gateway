[project]
name = "mlpal-gateway"
version = "0.2.6"
description = "MLPal Gateway — curated, self-hostable AI gateway (Anthropic-wire core, router tags, CU metering, admin console)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "MLPal", email = "contact@mlpal.ai" }]
keywords = ["ai", "gateway", "llm", "anthropic", "openai", "gemini", "bedrock", "router"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: FastAPI",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    # Redis
    "redis>=5.0.0",
    # AWS
    "boto3>=1.35.0",
    "aioboto3>=13.0.0",
    "aiobotocore>=2.15.0",
    "types-aiobotocore[s3]>=2.15.0",
    # AI Providers
    "openai>=1.50.0",
    "anthropic>=0.39.0",
    # Pinned: google-genai makes behavior-changing releases across majors
    # (e.g. 1.x→2.x altered Gemini tool/thinking handling). Pin to the tested
    # version; bump deliberately, not on a rebuild.
    "google-genai==2.10.0",
    # Security
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    # Validation & Settings
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    # HTTP Client
    "httpx>=0.27.0",
    # Utilities
    "structlog>=24.4.0",
    "orjson>=3.10.0",
    # OpenTelemetry
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-exporter-otlp>=1.28.0",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.49b0",
    "opentelemetry-instrumentation-redis>=0.49b0",
    "opentelemetry-instrumentation-httpx>=0.49b0",
    "opentelemetry-instrumentation-logging>=0.49b0",
    "opentelemetry-propagator-aws-xray>=1.0.0",
    # AWS Metrics (EMF)
    "aws-embedded-metrics>=3.2.0",
    # MCP
    "mcp>=1.0.0",
    "anyio>=4.0.0",
    "numpy>=2.4.1",
    "psycopg2-binary>=2.9.11",
]

[project.urls]
Homepage = "https://github.com/mlpal-ai/mlpal-gateway"
Repository = "https://github.com/mlpal-ai/mlpal-gateway"
Issues = "https://github.com/mlpal-ai/mlpal-gateway/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.27.0",
    "ruff==0.16.4",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
    "faker>=30.0.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mlpal_assistants_service"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
# E402: module-level imports after code are deliberate here (env-before-import
# in conftest, lazy composition-root imports). ARG/SIM dropped from select:
# FastAPI handlers/deps take unused-by-design params.
# UP042 (StrEnum) would change str(enum) semantics on serialized enums — keep
# the explicit (str, Enum) pattern.
ignore = ["E501", "B008", "B904", "E402", "UP042"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]  # re-export modules
# Dev/integration scripts: lint for correctness, not style.
"scripts/**" = ["E702", "E731", "I001", "B007", "C401", "C408", "W291"]
# Paper benchmark harness: measurement scripts, lint for correctness only.
"paper/**" = ["E702", "E731", "I001", "B007", "B023", "B905", "C401", "C408", "W291"]

[tool.ruff.lint.isort]
known-first-party = ["mlpal_assistants_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-v --tb=short"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.coverage.run]
source = ["src/mlpal_assistants_service"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
]
